services:
  postgres:
    image: postgres:17
    container_name: outreach-postgres
    environment:
      POSTGRES_USER: outreach
      POSTGRES_PASSWORD: outreach
      POSTGRES_DB: outreach
    ports:
      - "5433:5432"
    volumes:
      - outreach-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outreach -d outreach"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  outreach-postgres-data:
